schema_version: paper-registry-v1
authority: canonical-paper-identity-and-manuscript-routing
updated: "2026-09-02"

resolution_rules:
  - Resolve a paper alias through this registry before opening similarly named manuscript files.
  - Repository URLs and repository-relative paths define identity; absolute machine paths do not.
  - A sibling checkout with the declared repository_name is a convenience, not an authority.
  - The manuscript repository owns reader-facing prose, equations, structure, and its PDF.
  - Holstein_test owns implementation, tests, scientific settings, locked evidence, and result producers.
  - Read the target manuscript repository's AGENTS.md before manuscript work; Claude Code enters through CLAUDE.md.
  - Historical, upload, rescue, and in-research-repository manuscript copies are not active unless this registry names them.

